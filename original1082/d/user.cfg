// This file allows you to configure and customize your game or enable experimental features
// Remove "//" at the start of the line, if you wish to enable the option

// Allows you to use a custom resolution. The in-game option for Borderless Window is recommended instead.
// SCREENW=1280	
// SCREENH=720

// Enables the fullscreen option. Can cause issues on Windows 8 or later.
// enableFullscreen=1

// Adjusts the font-size of the game. Especially useful at higher resolutions (14-18 recommended)
// fontSize=18

// Enables a colored indicator if your barricades are lined up (may cause crashes)
// enableFenceCheck=1

// Allows the Sun Generators to animate and controls the animation speed (250 recommended)
// animateSunBattery=250

// Adjusts the speed of the range indicator for units (10-45 recommended) (default is 15)
// rangeSpeed=15
