# 빌드·테스트 CI
# 저장소에는 두 빌드가 있다: C# + MonoGame (dotnetpj/) 과 C++ (cpppj/).
# 클론 데이터(assets/game-data/)를 사용하므로 originals/ 없이도 데이터 통합 테스트를 실행한다.
name: CI

on:
  push:
  pull_request:

jobs:
  # C# + MonoGame 빌드 (dotnetpj/)
  dotnet-build-test:
    strategy:
      fail-fast: false
      matrix:
        # Windows 우선 (AGENTS.md). Linux 는 우선순위가 낮지만 빌드 깨짐을 일찍 알기 위해 함께 돌린다
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # global.json 과 솔루션이 있는 폴더에서 실행한다
        working-directory: dotnetpj
    steps:
      - uses: actions/checkout@v4

      # global.json 의 SDK 버전(10.0.x)을 설치
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnetpj/global.json

      - name: 복원
        run: dotnet restore Netstorm.sln

      - name: 빌드
        run: dotnet build Netstorm.sln --configuration Release --no-restore

      - name: 테스트
        run: dotnet test Netstorm.sln --configuration Release --no-build --verbosity normal

  # C++ 빌드 (cpppj/) — 지금은 기초 구조만 있다
  cpp-build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 구성
        run: cmake -S cpppj -B cpppj/build -DCMAKE_BUILD_TYPE=Release

      - name: 빌드
        run: cmake --build cpppj/build --config Release

      - name: 테스트
        run: ctest --test-dir cpppj/build --build-config Release --output-on-failure
